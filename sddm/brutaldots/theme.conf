[General]
# Which palette the greeter wears. You do not normally set this by hand: the
# shell rewrites this line whenever you toggle.
# See AGENTS.md "Dark mode follows the session".
dark=false

# Everything below is yours; the shell never touches these lines.

# Second line of the account card. Empty falls back to "Sign in".
message=

# Shown as a chip in the bottom bar so you can tell machines apart at a
# glance. Empty uses the hostname SDDM reports.
label=
