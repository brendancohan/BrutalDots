# BrutalDots prompt.
#
# Rounded pills: a U+E0B6 cap, a run of background, a U+E0B4 cap. The brand and
# directory share one shape, which is why the first has no right cap.
#
# Colour is always a background here, never text, and the caps and prompt mark
# use ANSI indices so they follow the terminal. See AGENTS.md "The terminal"
# before changing either — both rules have a legibility floor behind them.

"$schema" = 'https://starship.rs/config-schema.json'

palette = "brutaldots"

add_newline = true

format = "$os$directory$git_branch$git_status$cmd_duration$status$character"

# ── Palette ──────────────────────────────────────────────────────────────────
# The pastels are Config/Theme.qml verbatim, and `ink` is its ink. Retheming
# the prompt is a matter of editing this table. There is no dark counterpart
# and there does not need to be: `ink` is only ever used on top of one of the
# blocks below, never on the terminal's own background.
[palettes.brutaldots]
ink        = "#161110"
base       = "#FAF0E6"

red        = "#FF8A80"
coral      = "#FFAB91"
salmon     = "#FFB3A1"
orange     = "#F79E5D"
peach      = "#FFCC80"
yellow     = "#F2DC8F"
green      = "#C5E1A5"
mint       = "#A5D6A7"
teal       = "#80CBC4"
blue       = "#90CAF9"
lavender   = "#D1C4E9"
purple     = "#CE93D8"
pink       = "#FFCBD5"
grey       = "#E0E0E0"

# ── The brand cap ────────────────────────────────────────────────────────────
# An ink pill with the distro mark in cream, joined straight into the
# directory pill beside it — one rounded shape in two colours, which is the
# whole visual idea. It has no right cap for that reason.
[os]
disabled = false
format = "[](fg:ink)[ $symbol ](fg:base bg:ink)"

[os.symbols]
Arch       = "󰣇"
CachyOS    = "󰣇"
EndeavourOS = "󰣇"
Manjaro    = "󱄛"
Debian     = "󰣚"
Ubuntu     = "󰕈"
Fedora     = "󰣛"
NixOS      = "󱄅"
Alpine     = "󰔬"
Gentoo     = "󰣨"
openSUSE   = "󰆧"
Void       = "󰠳"
Linux      = "󰌽"
Macos      = "󰀵"
Windows    = "󰖳"

# ── Where you are ────────────────────────────────────────────────────────────
[directory]
style             = "fg:ink bg:peach"
read_only_style   = "fg:ink bg:peach"
home_symbol       = "~"
read_only         = " "
truncation_length = 3
truncation_symbol = "…/"
format = "[ 󰉋 $path]($style)[$read_only ]($read_only_style)[](fg:peach) "

[directory.substitutions]
"Desktop"   = ""
"Documents" = ""
"Downloads" = ""
"Music"     = "󰎈"
"Pictures"  = ""
"Videos"    = ""

# ── Git ──────────────────────────────────────────────────────────────────────
# Two pills, not one: the branch is always mint, and the status pill only
# exists when the tree has something to say. A clean tree is one calm pill.
[git_branch]
symbol            = "󰘬 "
truncation_length = 18
truncation_symbol = "…"
format = "([](fg:mint)[ $symbol$branch ](fg:ink bg:mint)[](fg:mint) )"

[git_status]
format = "([](fg:coral)[ $all_status$ahead_behind](fg:ink bg:coral)[](fg:coral) )"
conflicted = "= "
ahead      = "↑${count} "
behind     = "↓${count} "
diverged   = "↑${ahead_count}↓${behind_count} "
untracked  = "?${count} "
stashed    = "󰆓 ${count} "
modified   = "!${count} "
staged     = "+${count} "
renamed    = "»${count} "
deleted    = "${count} "

[git_state]
format = "([](fg:salmon)[ $state $progress_current/$progress_total ](fg:ink bg:salmon)[](fg:salmon) )"
cherry_pick = "PICKING"

# ── How long that took ───────────────────────────────────────────────────────
[cmd_duration]
min_time = 500
format = "([](fg:lavender)[ 󰔟 $duration ](fg:ink bg:lavender)[](fg:lavender) )"

# ── What went wrong ──────────────────────────────────────────────────────────
[status]
disabled = false
format = "([](fg:red)[  $status ](fg:ink bg:red)[](fg:red) )"

# ── The prompt itself ────────────────────────────────────────────────────────
# The chevrons are Config/Icons.qml's own `chevronRight` and `chevronLeft`, so
# the prompt is marked with the same glyph the bar and the dashboard use.
#
# Both were checked against JetBrainsMono Nerd Font in Regular and Bold. That
# matters more than it sounds: the obvious "➤" (U+27A4) is *not* in the font,
# and a missing glyph falls through to whatever fontconfig picks next — rarely
# a cell-width face, which knocks every pill on the line out of alignment.
#
# ANSI *indices* rather than palette names: the table above defines its own
# `red`, and a pastel is exactly the wrong thing drawn on a bare terminal
# background. 1, 3 and 4 cannot be shadowed, and are three the terminal itself
# repaints when the theme flips — index 3 is #883900 on the light palette and
# #F79E5D on the dark one, so the arrow is always the readable end of its hue.
[character]
success_symbol = "[󰅂](bold 3)"
error_symbol   = "[󰅂](bold 1)"
vimcmd_symbol  = "[󰅁](bold 4)"

# ── Off ──────────────────────────────────────────────────────────────────────
# The prompt says where you are and what git thinks. Everything else is one
# `disabled = false` away, and picks up the palette above when you enable it.
[package]
disabled = true

[username]
disabled = true

[hostname]
ssh_only = true
format = "([](fg:lavender)[ 󰒋 $hostname ](fg:ink bg:lavender)[](fg:lavender) )"
