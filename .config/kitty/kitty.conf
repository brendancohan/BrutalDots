# BrutalDots — kitty.
#
# This file is only written when you have no kitty.conf of your own; an existing
# one is never replaced, it just gains the include at the bottom. Everything
# here is a starting point and yours to change — the colours live in
# brutaldots.conf, which is included last so it wins the theme.

# ── Font ────────────────────────────────────────────────────────────────────
font_family             JetBrainsMono Nerd Font
font_size               11.0
disable_ligatures       never

# ── Cursor ──────────────────────────────────────────────────────────────────
cursor_shape            beam
cursor_blink_interval   0

# ── Window ──────────────────────────────────────────────────────────────────
# Hyprland draws the border and the hard offset shadow, so kitty draws neither.
hide_window_decorations yes
draw_minimal_borders    yes
window_padding_width    10
confirm_os_window_close 0

# ── Scrollback ──────────────────────────────────────────────────────────────
scrollback_lines        10000
map page_up             scroll_page_up
map page_down           scroll_page_down

# ── Font size ───────────────────────────────────────────────────────────────
map ctrl+plus           change_font_size all +1
map ctrl+equal          change_font_size all +1
map ctrl+minus          change_font_size all -1
map ctrl+0              change_font_size all 0

# ── Theme ───────────────────────────────────────────────────────────────────
# Last, so it wins over anything above it.
include brutaldots.conf
