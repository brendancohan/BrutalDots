# BrutalDots — kitty colours, light.
#
# Colours only, on purpose. It sets nothing else — no font, no padding, no
# cursor shape, no keybinds — so everything in your own kitty.conf keeps
# working. Nothing includes this file directly: brutaldots.conf points at
# whichever of the two palettes is live. See that file.
#
# The palette is derived from quickshell/brutal/Config/Theme.qml. The shell uses
# those pastels as fills with ink text on top; here the same hues *are* the
# text, on a cream background, so every one is pulled down to a readable tone.
# All sixteen clear WCAG 4.5:1 against the background (the darkest sits at 16.6,
# the lightest at 4.54) — nothing in this palette can render as invisible text.

# ── Surfaces ────────────────────────────────────────────────────────────────
background              #FAF0E6
foreground              #161110

# Brutalism is opaque. Transparency here would undercut the whole look, and the
# shell turns Hyprland's blur off for the same reason.
background_opacity      1.0
dynamic_background_opacity no

selection_background    #FFCC80
selection_foreground    #161110

cursor                  #161110
cursor_text_color       #FAF0E6

url_color               #005295

# ── The sixteen ─────────────────────────────────────────────────────────────
# The greyscale runs dark → light as black, bright white, white, bright black,
# which reads backwards from the names but is the only ordering that works on a
# light background: "bright white" has to be dark enough to see, and "bright
# black" is what programs reach for when they mean dim.

# black / bright black
color0                  #161110
color8                  #726c6a

# red / bright red
color1                  #a50d00
color9                  #da1100

# green / bright green
color2                  #255c27
color10                 #2b7c2e

# yellow / bright yellow
color3                  #883900
color11                 #b84d00

# blue / bright blue
color4                  #005295
color12                 #006fc8

# magenta / bright magenta
color5                  #802b8f
color13                 #b130c7

# cyan / bright cyan
color6                  #1f5853
color14                 #237870

# white / bright white
color7                  #565250
color15                 #44403f

# ── Frame ───────────────────────────────────────────────────────────────────
# Hyprland draws the border and the hard shadow, so kitty draws neither.
active_border_color     #161110
inactive_border_color   #726c6a
bell_border_color       #a50d00

# ── Tabs ────────────────────────────────────────────────────────────────────
# Flat and bordered, matching the bar's islands rather than fading or slanting.
tab_bar_style           separator
tab_separator           " │ "
tab_bar_margin_width    0
tab_title_template      "{index}: {title}"

active_tab_background   #FFCC80
active_tab_foreground   #161110
active_tab_font_style   bold
inactive_tab_background #E8E0D0
inactive_tab_foreground #565250
inactive_tab_font_style normal
tab_bar_background      #EFE0D6

# ── Bell ────────────────────────────────────────────────────────────────────
enable_audio_bell       no
visual_bell_duration    0.1
visual_bell_color       #FFB3A1

# ── Marks ───────────────────────────────────────────────────────────────────
mark1_foreground        #161110
mark1_background        #FFCC80
mark2_foreground        #161110
mark2_background        #A5D6A7
mark3_foreground        #161110
mark3_background        #90CAF9
