# BrutalDots — kitty colours, dark.
#
# The mirror of brutaldots-light.conf, and derived the same way: from the
# palette in quickshell/brutal/Config/Theme.qml. Where the light file pulls
# every pastel *down* so it can be read as text on cream, this one uses the
# pastels as they are — on a near-black background they are already the right
# end of the ramp. All fourteen chromatic entries clear WCAG 4.5:1 against the
# background, most of them by a wide margin.
#
# Nothing includes this file directly. brutaldots.conf points at whichever of
# the two is live; the shell rewrites that pointer when you toggle dark mode.

# ── Surfaces ────────────────────────────────────────────────────────────────
# The shell's `base` — the colour it paints a raised card, which is what a
# terminal window is.
background              #2A2320
foreground              #F4EADF

# Brutalism is opaque. Transparency here would undercut the whole look, and the
# shell turns Hyprland's blur off for the same reason.
background_opacity      1.0
dynamic_background_opacity no

selection_background    #8A5C22
selection_foreground    #F4EADF

cursor                  #F4EADF
cursor_text_color       #2A2320

url_color               #A8D5FB

# ── The sixteen ─────────────────────────────────────────────────────────────
# Unlike the light file, these run in the order the names suggest: on a dark
# background "black" can just be dark and "bright white" can just be the
# brightest thing here, so none of the inversions that file needs apply.
#
# color8 is the one worth knowing about — it is what programs reach for when
# they mean dim, so it is kept above 4.5:1 rather than left as a true grey that
# disappears into the background.

# black / bright black
color0                  #3B322E
color8                  #948880

# red / bright red
color1                  #FF8A80
color9                  #FFB9B3

# green / bright green
color2                  #A5D6A7
color10                 #C8E6C9

# yellow / bright yellow
color3                  #F79E5D
color11                 #F9BB8E

# blue / bright blue
color4                  #90CAF9
color12                 #C0E1FC

# magenta / bright magenta
color5                  #CE93D8
color13                 #DFB8E6

# cyan / bright cyan
color6                  #80CBC4
color14                 #A4DAD5

# white / bright white
color7                  #E0D5CA
color15                 #FAF0E6

# ── Frame ───────────────────────────────────────────────────────────────────
# Hyprland draws the border and the hard shadow, so kitty draws neither.
active_border_color     #F4EADF
inactive_border_color   #948880
bell_border_color       #FF8A80

# ── Tabs ────────────────────────────────────────────────────────────────────
# Flat and bordered, matching the bar's islands rather than fading or slanting.
tab_bar_style           separator
tab_separator           " │ "
tab_bar_margin_width    0
tab_title_template      "{index}: {title}"

active_tab_background   #8A5C22
active_tab_foreground   #F4EADF
active_tab_font_style   bold
inactive_tab_background #211B19
inactive_tab_foreground #948880
inactive_tab_font_style normal
tab_bar_background      #191413

# ── Bell ────────────────────────────────────────────────────────────────────
enable_audio_bell       no
visual_bell_duration    0.1
visual_bell_color       #A9503E

# ── Marks ───────────────────────────────────────────────────────────────────
mark1_foreground        #2A2320
mark1_background        #FFCC80
mark2_foreground        #2A2320
mark2_background        #A5D6A7
mark3_foreground        #2A2320
mark3_background        #90CAF9
